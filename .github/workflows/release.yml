name: Release

# Em todo push em `main` (tipicamente após merge de PR):
#  1. `test` roda `yarn test` (vitest) — gate de qualidade. Se algum
#     teste falhar, nenhum dos jobs seguintes roda (release/build).
#  2. `release` roda `semantic-release` — analisa os Conventional Commits
#     desde a última tag, decide o bump (fix → patch, feat → minor,
#     `feat!`/BREAKING CHANGE → major), atualiza CHANGELOG.md +
#     package.json, cria a tag `vX.Y.Z` e a GitHub Release.
#  3. `build` espera o release, e SÓ roda se houver release nova. Faz
#     `yarn electron:build` em Windows/macOS/Linux em paralelo e anexa
#     os instaladores à release recém-criada.
#  4. `publish-public` junta os instaladores das três máquinas e os publica,
#     uma vez, no repo público de releases (SPEC-0740).
#
# Pra buildar sem cortar release (debug, dry-run em PR), use
# `build-ide.yml` que tem trigger manual (`workflow_dispatch`).

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Repo PÚBLICO só de releases (SPEC-0740, TDR-0015): o engine é privado e a release dele também; os instaladores
  # são publicados de novo lá para download sem login.
  RELEASES_OWNER: BuuhV-Projects
  RELEASES_REPO: cortex-studio-releases

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Encoder WASM (pinado) usado pelos testes de política de encode KTX2
      # (tests/native/encode-ktx2.test.ts, ADR-0119) — não vive no git
      # (native/tools/ é gitignorado). Sem ele a suíte pularia (runIf).
      - name: Fetch basis encoder
        run: node native/scripts/fetch-basis-encoder.mjs

      # Toolchain de export (TDR-0003): o smoke isolado
      # (tests/native/export-isolated-smoke.test.ts) roda o bundle.mjs REAL
      # com ele como única árvore de módulos — é o teste que pega dep faltando
      # que só quebra no Studio instalado (SPEC-0177). Sem este step ele
      # aborta o job em vez de passar batido.
      - name: Install export toolchain
        working-directory: native/export-toolchain
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: yarn test

  release:
    name: Decide release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}

    steps:
      # Token de instalação do GitHub App da org (TDR-0006). É ele — e não o
      # GITHUB_TOKEN — que está na bypass list do ruleset da `main`, então é
      # quem consegue pushar o commit de release na branch protegida. O
      # GITHUB_TOKEN não pode ganhar esse bypass: o "GitHub Actions" é um app
      # implícito e o ruleset só aceita apps instalados na organização.
      - name: Gerar token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CORTEX_CI_APP_ID }}
          private-key: ${{ secrets.CORTEX_CI_APP_PRIVATE_KEY }}

      # SPEC-0740: confere o repo público e a instalação do App nele ANTES do semantic-release. Sem eles o job para
      # aqui e nenhuma release do engine sai pela metade (sem a cópia pública).
      - name: Gerar token do App para o repo público de releases
        id: releases-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CORTEX_CI_APP_ID }}
          private-key: ${{ secrets.CORTEX_CI_APP_PRIVATE_KEY }}
          owner: ${{ env.RELEASES_OWNER }}
          repositories: ${{ env.RELEASES_REPO }}

      - name: Conferir o repo público de releases
        env:
          GH_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          gh api "repos/$RELEASES_OWNER/$RELEASES_REPO" --jq '.full_name + " (privado: " + (.private|tostring) + ")"'

      - name: Checkout (full history pra analisar commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # O token é gravado nos credentials pelo checkout — semantic-release
          # precisa disso pra dar `git push` do commit de release.
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          # Token do app (TDR-0006), não o GITHUB_TOKEN: além do bypass na
          # `main`, a tag criada por ele acorda triggers de push downstream —
          # o que a tag do GITHUB_TOKEN não faz. O commit de release leva
          # `[skip ci]` na mensagem pra não reentrar neste mesmo workflow.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  build:
    name: Build (${{ matrix.os }})
    needs: [test, release]
    if: needs.release.outputs.released == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout no tag de release
        uses: actions/checkout@v4
        with:
          # Faz o checkout da tag recém-criada pelo semantic-release — assim
          # o build pega a versão bumpada no package.json + o CHANGELOG.
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Host CortexNative + toolchain de export (só Windows): embarca o host
      # compilado no instalador pra exportar nativo sem dev (TDR-0003).
      - name: Build native host (Windows)
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/build-native-host
        with:
          # Sem a secret (fork/PR de terceiro) o host Steam é pulado e o
          # instalador sai sem ele — o CI não pode ficar vermelho por isso
          # (ADR-0176).
          steamworks-sdk-key: ${{ secrets.STEAMWORKS_SDK_KEY }}

      - name: Build IDE
        # electron-builder valida a release no GitHub durante o build e exige
        # GH_TOKEN (não GITHUB_TOKEN). Sem ele falha com "GitHub Personal
        # Access Token is not set". Aqui o GITHUB_TOKEN basta: ler a release e
        # anexar asset não passa pela proteção da branch.
        env:
          GH_TOKEN: ${{ github.token }}
        run: yarn electron:build

      - name: Anexar instaladores à release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          token: ${{ github.token }}
          files: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
          fail_on_unmatched_files: false

      # SPEC-0740: os instaladores vão para o job `publish-public`, o único que escreve no repo público (sem três
      # máquinas criando a mesma release ao mesmo tempo).
      - name: Guardar os instaladores para o repo público
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
          if-no-files-found: warn
          # dá tempo de re-executar o `publish-public` se ele falhar (a tag do engine já saiu)
          retention-days: 7

  # SPEC-0740: a release pública, criada uma vez só, com o que as máquinas da matriz geraram. Roda mesmo se uma das
  # máquinas falhar e publica os instaladores que existirem (as outras já anexaram à release do engine); sem nenhum,
  # o download dos artefatos falha. Só não roda se o workflow foi cancelado.
  publish-public:
    name: Publicar no repo público
    needs: [release, build]
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dos scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          sparse-checkout: .github/scripts

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Baixar os instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist-app

      # As notas do semantic-release apontam para o repo privado (commits, comparação, issues): saem sem esses links.
      - name: Notas sem os links do repo privado
        env:
          NOTES: ${{ needs.release.outputs.notes }}
          PRIVATE_REPO: ${{ github.repository }}
        run: node .github/scripts/public-notes.mjs > "$RUNNER_TEMP/public-notes.md"

      - name: Gerar token do App para o repo público de releases
        id: releases-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CORTEX_CI_APP_ID }}
          private-key: ${{ secrets.CORTEX_CI_APP_PRIVATE_KEY }}
          owner: ${{ env.RELEASES_OWNER }}
          repositories: ${{ env.RELEASES_REPO }}

      - name: Publicar instaladores no repo público
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_OWNER }}/${{ env.RELEASES_REPO }}
          token: ${{ steps.releases-token.outputs.token }}
          tag_name: ${{ needs.release.outputs.tag }}
          name: TS Cortex Studio ${{ needs.release.outputs.version }}
          body_path: ${{ runner.temp }}/public-notes.md
          make_latest: 'true'
          files: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
          # release parcial é intencional: uma máquina que falhou não segura as outras
          fail_on_unmatched_files: false
