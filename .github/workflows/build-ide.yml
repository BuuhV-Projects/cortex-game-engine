name: Build IDE (manual)

# Build manual em todas as plataformas — útil pra debugar a pipeline
# sem cortar uma release. Não anexa nada a releases nem cria tags.
# Os instaladores ficam como artifacts do run (14 dias).
#
# Mesmo gate de testes do release.yml: o build matrix só roda se o
# job `test` (yarn test) passar — protege contra publicar artifact
# de versão com testes quebrados.
#
# O fluxo automático de release vive em `release.yml`, disparado em
# todo push em `main`.

on:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Encoder WASM (pinado) usado pelos testes de política de encode KTX2
      # (tests/native/encode-ktx2.test.ts, ADR-0119) — não vive no git
      # (native/tools/ é gitignorado). Sem ele a suíte pularia (runIf).
      - name: Fetch basis encoder
        run: node native/scripts/fetch-basis-encoder.mjs

      # Toolchain de export (TDR-0003): o smoke isolado
      # (tests/native/export-isolated-smoke.test.ts) roda o bundle.mjs REAL
      # com ele como única árvore de módulos — é o teste que pega dep faltando
      # que só quebra no Studio instalado (SPEC-0177). Sem este step ele
      # aborta o job em vez de passar batido.
      - name: Install export toolchain
        working-directory: native/export-toolchain
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: yarn test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Host CortexNative + toolchain de export (só Windows): embarca o host
      # compilado no instalador pra exportar nativo sem dev (TDR-0003).
      - name: Build native host (Windows)
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/build-native-host

      - name: Build IDE
        # electron-builder exige GH_TOKEN (não GITHUB_TOKEN) durante o build.
        # PAT em REPO_ACCESS_TOKEN tem precedência; github.token funciona
        # como fallback pra runs locais ao workflow.
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}
        run: yarn electron:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-ide-${{ matrix.os }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.AppImage
          if-no-files-found: warn
          retention-days: 14
