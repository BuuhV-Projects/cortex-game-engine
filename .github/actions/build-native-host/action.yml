name: Build CortexNative host
description: >-
  Compila o host nativo (cortex_host.exe + rapier_native.dll) e instala o
  toolchain de export auto-contido, pra o Studio empacotado exportar nativo
  sem dev (TDR-0003). Windows-only — quem chama gateia com
  `if: matrix.os == 'windows-latest'`.

runs:
  using: composite
  steps:
    # Toolchain de compilação do host: Rust (crate rapier-native), Ninja+CMake
    # (host C++) e o ambiente MSVC (vcvars) — headers/libs do Windows SDK e o
    # linker, usados TAMBÉM pelo clang-cl (que é só o frontend).
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Setup MSVC (vcvars)
      uses: ilammy/msvc-dev-cmd@v1

    # Deps prebuilt PINADAS do host (SDL3, wgpu-native, stb, miniaudio, fonte)
    # + clone pinado do facebook/hermes com os patches locais (ADR-0122).
    # Cacheado: o clone do Hermes é o item pesado; fetch-deps é idempotente e
    # o `git apply --check` pula os patches se o cache já veio patchado.
    - name: Cache deps nativas
      uses: actions/cache@v4
      with:
        path: |
          native/third_party
          native/tools
        key: native-deps-${{ runner.os }}-${{ hashFiles('native/scripts/fetch-deps.ps1', 'native/patches/hermes-upstream.patch') }}

    - name: Fetch deps nativas (pinadas)
      shell: pwsh
      run: powershell -ExecutionPolicy Bypass -File native/scripts/fetch-deps.ps1

    # 1) crate Rust (cdylib) → target/release/rapier_native.dll(.lib); o CMake
    # linka o .lib e copia a dll pro native/build.
    - name: Build rapier-native (cargo)
      shell: pwsh
      run: cargo build --release --manifest-path native/rapier-native/Cargo.toml

    # Cache do build C++ (Ninja incremental): o Hermes upstream são ~450 alvos
    # e recompilar do zero leva dezenas de minutos no runner. Key muda quando
    # muda o CMake, os patches ou o commit pinado (via fetch-deps.ps1).
    - name: Cache build do host (Ninja)
      uses: actions/cache@v4
      with:
        path: native/build
        key: native-build-${{ runner.os }}-clang-${{ hashFiles('native/CMakeLists.txt', 'native/scripts/fetch-deps.ps1', 'native/patches/hermes-upstream.patch') }}
        restore-keys: |
          native-build-${{ runner.os }}-clang-

    # 2) host C++ (Ninja) → native/build com cortex_host.exe + dlls + fontes.
    # Compilador OFICIAL do host PC é o clang-cl (ADR-0122: interpretador do
    # Hermes ~20% mais rápido que com MSVC — é o host que o instalador embarca
    # nos exports dos usuários). Os runners windows-latest têm LLVM
    # pré-instalado; se um dia sumir, cai pro cl.exe (fallback suportado,
    # mesmo caminho da toolchain GDKX/console — só mais lento).
    - name: Build host (CMake + Ninja, clang-cl)
      shell: pwsh
      run: |
        $clang = 'C:/Program Files/LLVM/bin/clang-cl.exe'
        $compilerArgs = @()
        if (Test-Path $clang) {
          Write-Host "usando clang-cl: $clang"
          $compilerArgs = @("-DCMAKE_C_COMPILER=$clang", "-DCMAKE_CXX_COMPILER=$clang")
        } else {
          Write-Warning 'clang-cl nao encontrado no runner — fallback MSVC (host ~20% mais lento)'
        }
        cmake -G Ninja -S native -B native/build -DCMAKE_BUILD_TYPE=Release @compilerArgs
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cmake --build native/build
        if ($LASTEXITCODE -ne 0) { exit 1 }

    # 3) toolchain de export auto-contido (esbuild/babel/three/zod) — copiado
    # pra resources/node_modules pelo electron-builder (win.extraResources).
    - name: Install export toolchain
      shell: pwsh
      working-directory: native/export-toolchain
      run: yarn install --frozen-lockfile
