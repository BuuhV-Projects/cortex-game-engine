<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cortex-game-engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./ide-design.css" />
  </head>
  <body>
    <div id="shell-root" class="ide col">
      <div id="menubar"></div>
      <div id="toolbar"></div>
      <div id="app">
        <aside id="left-dock"></aside>
        <div class="resizer" id="resizer-left"></div>
        <section id="center">
          <div id="center-top">
            <main id="editor-container"></main>
            <div id="preview-container"></div>
          </div>
          <div class="resizer-horizontal" id="resizer-bottom"></div>
          <div id="console-container"></div>
        </section>
        <div class="resizer" id="resizer-inspector"></div>
        <aside id="inspector-container"></aside>
        <div class="resizer" id="resizer-chat"></div>
        <aside id="chat-container"></aside>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
