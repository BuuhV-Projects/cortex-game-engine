<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="docs.page_title">Documentation — cortex-game-engine</title>
    <meta
      name="description"
      data-i18n-description="docs.page_description"
      content="Documentation for cortex-game-engine — 3D game IDE with AI + TypeScript."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased">
    <header
      class="sticky top-0 z-50 border-b border-zinc-800/60 bg-zinc-950/80 backdrop-blur"
    >
      <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
        <a href="/" class="flex items-center gap-2 text-sm font-semibold tracking-tight">
          <span class="inline-block h-2 w-2 rounded-full bg-sky-400"></span>
          cortex-game-engine
        </a>
        <nav class="flex items-center gap-1 text-sm">
          <a
            href="/"
            data-i18n="nav.home"
            class="rounded-md px-3 py-1.5 text-zinc-300 transition hover:bg-zinc-800 hover:text-white"
          >
            Home
          </a>
          <a
            href="/docs.html"
            data-i18n="nav.docs"
            class="rounded-md bg-zinc-800 px-3 py-1.5 text-white"
            aria-current="page"
          >
            Documentation
          </a>
          <a
            href="https://github.com/BuuhV-Projects/cortex-game-engine"
            data-i18n="nav.github"
            class="rounded-md px-3 py-1.5 text-zinc-300 transition hover:bg-zinc-800 hover:text-white"
          >
            GitHub
          </a>
          <span class="ml-2 inline-flex items-center gap-0.5 rounded-md border border-zinc-800 p-0.5 text-xs">
            <button
              type="button"
              data-lang="en"
              class="rounded px-2 py-1 text-zinc-300 transition hover:text-white"
            >
              EN
            </button>
            <button
              type="button"
              data-lang="pt"
              class="rounded px-2 py-1 text-zinc-300 transition hover:text-white"
            >
              PT
            </button>
          </span>
        </nav>
      </div>
    </header>

    <div class="mx-auto flex max-w-6xl gap-8 px-6 py-12">
      <!-- Sidebar com lista de docs (preenchida pelo TS) -->
      <aside class="hidden w-56 flex-shrink-0 md:block">
        <p data-i18n="docs.sidebar_label" class="mb-3 text-xs font-semibold uppercase tracking-widest text-zinc-500">
          Documentation
        </p>
        <nav id="docs-nav" class="flex flex-col gap-0.5 text-sm">
          <!-- Lista renderizada por src/docs.ts -->
        </nav>
      </aside>

      <!-- Conteúdo do markdown selecionado -->
      <article
        id="docs-content"
        class="prose-cortex min-w-0 flex-1 leading-relaxed"
      >
        <p data-i18n="docs.loading" class="text-zinc-500">Loading...</p>
      </article>
    </div>

    <script type="module" src="/src/docs.ts"></script>
  </body>
</html>
